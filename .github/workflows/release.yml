# Реліз PowerHub: збирання на Windows, тести, zip і публікація на GitHub Releases.
# Запуск: пуш тега vX.Y.Z або вручну (Actions → Release → Run workflow, версія без «v»).
# Версія має збігатися з <Version> у PowerHub.csproj, опис релізу — docs/releases/<версія>.md
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версія без «v», напр. 0.5.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Версія
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          $proj = ([xml](Get-Content PowerHub.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($proj -ne $v) { throw "Версія $v не збігається з <Version>$proj</Version> у PowerHub.csproj" }
          if (-not (Test-Path "docs/releases/$v.md")) { throw "Немає опису релізу docs/releases/$v.md" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Тести
        run: dotnet test tests/PowerHub.Tests -c Release

      - name: Збирання
        run: dotnet build PowerHub.csproj -c Release -p:Platform=x64

      - name: Архів
        id: pack
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $out = 'bin/x64/Release/net8.0-windows10.0.22621.0/win-x64'
          if (-not (Test-Path "$out/PowerHub.exe")) { throw "Немає $out/PowerHub.exe" }
          # Усередині архіву — папка PowerHub з усім потрібним для запуску (без налагоджувальних .pdb)
          New-Item -ItemType Directory -Path PowerHub | Out-Null
          Copy-Item -Path "$out/*" -Destination PowerHub -Recurse
          Get-ChildItem PowerHub -Recurse -Filter *.pdb | Remove-Item
          $zip = "PowerHub-$v-win-x64.zip"
          Compress-Archive -Path PowerHub -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          $notes = (Get-Content "docs/releases/$v.md" -Raw) + "`nSHA-256 ($zip): ``$hash```n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PowerHub ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: ${{ steps.pack.outputs.zip }}
