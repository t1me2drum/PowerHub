# Реліз PowerHub: збирання на Windows, тести, zip і MSI (tools/package.ps1) і публікація на GitHub Releases.
# Запуск: пуш тега vX.Y.Z або вручну (Actions → Release → Run workflow, версія без «v»).
# Версія має збігатися з <Version> у PowerHub.csproj, опис релізу — docs/release-notes/<версія>.md
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версія без «v», напр. 0.5.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Версія
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          $proj = ([xml](Get-Content PowerHub.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($proj -ne $v) { throw "Версія $v не збігається з <Version>$proj</Version> у PowerHub.csproj" }
          if (-not (Test-Path "docs/release-notes/$v.md")) { throw "Немає опису релізу docs/release-notes/$v.md" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Тести
        run: dotnet test tests/PowerHub.Tests -c Release

      - name: Збирання
        run: dotnet build PowerHub.csproj -c Release -p:Platform=x64

      - name: WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Архів і MSI
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $hashes = ./tools/package.ps1 -Version $v
          $fence = '```'
          $notes = (Get-Content "docs/release-notes/$v.md" -Raw) + "`nSHA-256:`n$fence`n" + ($hashes -join "`n") + "`n$fence`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PowerHub ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            artifacts/*.zip
            artifacts/*.msi
